[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = '''
/(
  venv
  | \.venv
  | outputs
  | inputs
  | \.agents
  | \.claude
)/
'''

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["venv", ".venv", "outputs", "inputs", ".agents", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
